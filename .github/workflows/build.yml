name: Build P2P Transfer App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Scaffold Project
        run: flutter create --platforms=android .

      - name: Add Android Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

      # 兼容适配 .gradle 或 .gradle.kts，强制将 compileSdk/compileSdkVersion 设为 36
      - name: Patch compileSdk Version
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/compileSdkVersion(.*/compileSdkVersion(36)/' android/app/build.gradle.kts
            cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              afterEvaluate {
                  if (project.hasProperty("android")) {
                      val android = project.extensions.findByName("android") as? com.android.build.gradle.BaseExtension
                      android?.compileSdkVersion(36)
                  }
              }
          }
          EOF
          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
            cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Project
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: build/windows/x64/runner/Release/
