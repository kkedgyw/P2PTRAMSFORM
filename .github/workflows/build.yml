name: Build P2P Transfer App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      
      - name: Scaffold Project
        run: flutter create --project-name p2p_transfer --platforms=android .

      - name: Add Android Permissions
        # 权限必须声明在 <manifest> 下、<application> 之外，故插入 <application 标签之前
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_REMOTE_MESSAGING"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>' android/app/src/main/AndroidManifest.xml

      - name: Add Foreground Service Declaration
        # flutter_foreground_task 要求：service 名称不可修改
        run: |
          sed -i 's#</application>#    <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService" android:foregroundServiceType="dataSync|remoteMessaging" android:exported="false" />\n    </application>#' android/app/src/main/AndroidManifest.xml

      - name: Verify Android Manifest Patching
        # sed 注入是脆弱环节，失败就在这一步暴露，别拖到运行时崩溃
        run: |
          grep -q 'flutter_foreground_task.service.ForegroundService' android/app/src/main/AndroidManifest.xml || { echo "::error::ForegroundService 未注入 manifest"; exit 1; }
          grep -q 'android.permission.FOREGROUND_SERVICE' android/app/src/main/AndroidManifest.xml || { echo "::error::FOREGROUND_SERVICE 权限缺失"; exit 1; }
          echo "manifest 校验通过"

      - name: Install Android SDK 35
        # androidx.core:1.15.0（flutter_foreground_task 引入）的 AAR metadata 要求 compileSdk >= 35
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" \
                   "$SDK/cmdline-tools/bin/sdkmanager" \
                   "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then SM="$c"; break; fi
          done
          [ -n "$SM" ] || { echo "::error::sdkmanager 未找到"; exit 1; }
          echo "SDK root = $SDK"
          echo "sdkmanager = $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-35"
          "$SM" --install "build-tools;35.0.0"
          ls "$SDK/platforms"

      - name: Upgrade Android toolchain
        # flutter_foreground_task 9.2.2 硬性要求 Kotlin>=1.9.10、Gradle>=8.6.0；
        # 且 API 35 官方要求 AGP>=8.6（Flutter 3.24.5 模板默认 Kotlin 1.8.22 / AGP 8.1.0，不满足）
        run: |
          set -e
          BG=android/app/build.gradle
          SG=android/settings.gradle
          GW=android/gradle/wrapper/gradle-wrapper.properties

          # 1) Gradle wrapper -> 8.7（AGP 8.6 的最低要求）
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip|' "$GW"

          # 2) AGP -> 8.6.0（官方支持 compileSdk 35 的最低版本）
          sed -i 's|\(id "com.android.application" version \)"[0-9.]*"|\1"8.6.0"|' "$SG"

          # 3) Kotlin -> 1.9.24（插件要求 1.9.10+）
          sed -i 's|\(id "org.jetbrains.kotlin.android" version \)"[0-9.]*"|\1"1.9.24"|' "$SG"

          # 4) compileSdk -> 35（targetSdk 保持 flutter 默认 34，避开 Android 15 行为变更）
          sed -i 's|flutter\.compileSdkVersion|35|' "$BG"

          grep -n 'gradle-8.7' "$GW"
          grep -n 'com.android.application" version' "$SG"
          grep -n 'kotlin.android" version' "$SG"
          grep -n 'compileSdk' "$BG"

      - name: Verify Android toolchain patching
        # sed 注入是脆弱环节，版本不对就当场失败，别等到 3 分钟后的 Gradle 才报错
        run: |
          set -e
          grep -q 'gradle-8.7' android/gradle/wrapper/gradle-wrapper.properties \
            || { echo "::error::Gradle wrapper 未升到 8.7"; exit 1; }
          grep -q 'com.android.application" version "8.6.0"' android/settings.gradle \
            || { echo "::error::AGP 未升到 8.6.0"; exit 1; }
          grep -q 'kotlin.android" version "1.9.24"' android/settings.gradle \
            || { echo "::error::Kotlin 未升到 1.9.24"; exit 1; }
          grep -qE 'compileSdk(Version)?[[:space:]]*[= ][[:space:]]*35' android/app/build.gradle \
            || { echo "::error::compileSdk 未升到 35"; exit 1; }
          echo "工具链校验通过：Gradle 8.7 / AGP 8.6.0 / Kotlin 1.9.24 / compileSdk 35"

      - name: Install dependencies (Android)
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    # 锁定标准的 windows-2022 镜像环境
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Enable Windows Desktop & Scaffold
        run: |
          flutter config --enable-windows-desktop
          flutter create --project-name p2p_transfer --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      # 使用 cmd 调用 VS 2022 官方环境变量入口执行编译
      - name: Build Windows Executable
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          flutter build windows --release

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: build/windows/x64/runner/Release/
