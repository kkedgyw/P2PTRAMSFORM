name: Build P2P Transfer App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      
      - name: Scaffold Project
        run: flutter create --project-name p2p_transfer --platforms=android .

      - name: Add Android Permissions
        # 权限必须声明在 <manifest> 下、<application> 之外，故插入 <application 标签之前
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_REMOTE_MESSAGING"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>' android/app/src/main/AndroidManifest.xml

      - name: Add Foreground Service Declaration
        # flutter_foreground_task 要求：service 名称不可修改
        run: |
          sed -i 's#</application>#    <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService" android:foregroundServiceType="dataSync|remoteMessaging" android:exported="false" />\n    </application>#' android/app/src/main/AndroidManifest.xml

      - name: Verify Android Manifest Patching
        # sed 注入是脆弱环节，失败就在这一步暴露，别拖到运行时崩溃
        run: |
          grep -q 'flutter_foreground_task.service.ForegroundService' android/app/src/main/AndroidManifest.xml || { echo "::error::ForegroundService 未注入 manifest"; exit 1; }
          grep -q 'android.permission.FOREGROUND_SERVICE' android/app/src/main/AndroidManifest.xml || { echo "::error::FOREGROUND_SERVICE 权限缺失"; exit 1; }
          echo "manifest 校验通过"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    # 锁定标准的 windows-2022 镜像环境
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Enable Windows Desktop & Scaffold
        run: |
          flutter config --enable-windows-desktop
          flutter create --project-name p2p_transfer --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      # 使用 cmd 调用 VS 2022 官方环境变量入口执行编译
      - name: Build Windows Executable
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          flutter build windows --release

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: build/windows/x64/runner/Release/
