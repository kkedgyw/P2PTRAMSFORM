name: Build P2P Transfer App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Scaffold Project
        run: flutter create --platforms=android .

      - name: Add Android Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

      # 统一将 compileSdk 设为 36，并配置覆盖第三方插件的 compileSdkVersion
      - name: Patch Android SDK Configuration
        run: |
          # 1. 替换主 app 的 compileSdk
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
          fi

          # 2. 在根目录 build.gradle.kts 中配置统一覆盖（不使用 afterEvaluate）
          if [ -f "android/build.gradle.kts" ]; then
            cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              project.plugins.withId("com.android.library") {
                  val android = project.extensions.findByType(com.android.build.gradle.BaseExtension::class.java)
                  android?.compileSdkVersion(36)
              }
          }
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Project
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: build/windows/x64/runner/Release/
