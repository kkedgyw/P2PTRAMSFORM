name: p2p_file_transfer
description: "A P2P file transfer app"
publish_to: "none"
version: 1.0.0+1

environment:
  # flutter_foreground_task 9.2.2 要求 Dart >=3.4.0
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.2.0
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  network_info_plus: ^5.0.1
  permission_handler: ^11.3.1
  path: ^1.9.0
  # 注意：不要升到 10.x/11.x —— 那两代要求 Flutter >=3.38/3.44，
  # 而本仓库 CI 锁定 Flutter 3.24.5，升上去 pub get 会直接解析失败。
  flutter_foreground_task: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
